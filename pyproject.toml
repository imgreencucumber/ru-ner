[project]
name = "ru-ner"
version = "0.1.0"
description = "Russian NER: CRF vs fine-tuned ruBERT vs LLMs, with ONNX optimization and FastAPI serving"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Only what the service needs: ONNX inference without PyTorch. Everything else is in groups.
dependencies = [
    "fastapi>=0.143.0",
    "numpy",
    "onnxruntime>=1.31.0",
    "tokenizers>=0.23.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
# training, baselines, ONNX export, LLM experiments
research = [
    "torch>=2.6",
    "transformers>=4.46",
    "datasets>=3.0",
    "seqeval>=1.2",
    "accelerate>=1.0",
    "pandas",
    "sklearn-crfsuite>=0.5.0",
    "natasha>=1.6.0",
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "py-cpuinfo>=9.0.0",
    "gigachat>=0.2.3",
    "python-dotenv>=1.2.4",
    "httpx>=0.28.1",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "nbconvert>=7.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ru_ner"]

[tool.uv]
# `uv sync` installs everything locally; the Docker image uses `--no-default-groups`
default-groups = ["dev", "research"]

# GTX 1060 (Pascal, sm_61): CUDA 12.8+ builds of PyTorch dropped Pascal support, so on Windows
# torch is pulled from the CUDA 12.6 index. On Linux (CI) the small CPU-only build is enough.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# notebooks set up warnings/logging before the noisy imports
"*.ipynb" = ["E402"]
