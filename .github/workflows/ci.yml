name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          enable-cache: true

      # On Linux PyTorch comes from the CPU-only index (see tool.uv.sources in pyproject.toml)
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # Tests use small fake models and don't download anything
      - name: Tests
        run: uv run pytest -q
