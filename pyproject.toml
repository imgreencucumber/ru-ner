[project]
name = "ru-ner"
version = "0.1.0"
description = "Russian NER and PII detection: CRF vs fine-tuned transformers vs LLMs, with ONNX optimization and FastAPI serving"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=4.46",
    "datasets>=3.0",
    "evaluate>=0.4",
    "seqeval>=1.2",
    "accelerate>=1.0",
    "numpy",
    "pandas",
    "sklearn-crfsuite>=0.5.0",
    "natasha>=1.6.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxscript>=0.7.2",
    "py-cpuinfo>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "nbconvert>=7.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ru_ner"]

# GTX 1060 (Pascal, sm_61): CUDA 12.8+ builds of PyTorch dropped Pascal support,
# so torch is pulled from the CUDA 12.6 index.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# notebooks set up warnings/logging before the noisy imports
"*.ipynb" = ["E402"]
